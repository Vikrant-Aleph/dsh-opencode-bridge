name: Update npm download charts

on:
  schedule:
    # UTC 02:27 = Asia/Shanghai 10:27. npm publishes daily statistics after UTC midnight.
    - cron: '27 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# All workflows publishing to this branch must use the same concurrency group.
concurrency:
  group: generated-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          # Keep the job-scoped token only for the generated-artifact commit below.
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Fetch complete history and generate both charts
        run: node scripts/update-downloads.mjs
      - name: Publish changed statistics to generated-data
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d "$RUNNER_TEMP/generated-data.XXXXXX")"
          remote_ref=refs/heads/generated-data
          if git ls-remote --exit-code --heads origin "$remote_ref" > /dev/null; then
            git fetch --no-tags origin "$remote_ref"
            git worktree add --detach "$publish_dir" FETCH_HEAD
          else
            status=$?
            # Exit code 2 means the branch is absent; network/auth errors must fail.
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            git worktree add --detach "$publish_dir" HEAD
            # Start with an empty tree and no source history, without switching main.
            git -C "$publish_dir" switch --orphan generated-data
          fi
          # Update only this task's files, preserving data published by other tasks.
          mkdir -p "$publish_dir/npm-downloads"
          cp assets/npm-downloads.json "$publish_dir/npm-downloads/history.json"
          cp assets/npm-downloads.svg "$publish_dir/npm-downloads/downloads.svg"
          cp assets/npm-downloads.us.svg "$publish_dir/npm-downloads/downloads.us.svg"
          git -C "$publish_dir" add -- npm-downloads/history.json npm-downloads/downloads.svg npm-downloads/downloads.us.svg
          if git -C "$publish_dir" diff --cached --quiet; then
            echo 'Statistics unchanged.'
            exit 0
          fi
          git -C "$publish_dir" -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            -c commit.gpgsign=false commit -m 'data: update npm download charts'
          # Never force-push: an unexpected competing writer must not lose its data.
          git -C "$publish_dir" push origin "HEAD:$remote_ref"
