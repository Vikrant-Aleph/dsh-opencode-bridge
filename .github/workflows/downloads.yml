name: Update npm download charts

# Temporary, user-approved scheduling test on the actual workflow, not a new probe.
# Restore the original daily workflow after the one-hour observation window.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

# No checkout, API calls, secrets, generation or repository writes during this test.
permissions: {}

concurrency:
  group: generated-data
  cancel-in-progress: false

jobs:
  schedule-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PROBE_ID: downloads-schedule-20261118T0517Z
      PROBE_EVENT: ${{ github.event_name }}
      PROBE_SCHEDULE: ${{ github.event.schedule }}
      PROBE_ACTOR: ${{ github.actor }}
      PROBE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      PROBE_REF: ${{ github.ref }}
      PROBE_SHA: ${{ github.sha }}
      PROBE_WORKFLOW_REF: ${{ github.workflow_ref }}
      PROBE_RUN_ID: ${{ github.run_id }}
      PROBE_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Record actual trigger without updating download data
        shell: bash
        run: |
          printf 'diagnostic_id=%s\n' "$PROBE_ID"
          printf 'utc=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          printf 'event=%s\nschedule=%s\nactor=%s\ntriggering_actor=%s\n' \
            "$PROBE_EVENT" "$PROBE_SCHEDULE" "$PROBE_ACTOR" "$PROBE_TRIGGERING_ACTOR"
          printf 'ref=%s\nsha=%s\nworkflow_ref=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$PROBE_REF" "$PROBE_SHA" "$PROBE_WORKFLOW_REF" "$PROBE_RUN_ID" "$PROBE_RUN_ATTEMPT"
