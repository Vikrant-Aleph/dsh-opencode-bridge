name: Temporary schedule diagnostic

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

# Read-only scheduling probe: no checkout, API calls, secrets or repository writes.
permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PROBE_EVENT: ${{ github.event_name }}
      PROBE_SCHEDULE: ${{ github.event.schedule }}
      PROBE_ACTOR: ${{ github.actor }}
      PROBE_REF: ${{ github.ref }}
      PROBE_SHA: ${{ github.sha }}
    steps:
      - name: Record actual trigger and UTC time
        shell: bash
        run: |
          printf 'utc=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          printf 'event=%s\nschedule=%s\nactor=%s\nref=%s\nsha=%s\n' \
            "$PROBE_EVENT" "$PROBE_SCHEDULE" "$PROBE_ACTOR" "$PROBE_REF" "$PROBE_SHA"
